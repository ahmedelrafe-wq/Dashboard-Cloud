<div class="reset-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  
  <div class="card reset-card border-0 shadow bg-white p-4 w-100" style="max-width: 400px;">
    
    <h4 class="fw-bold mb-2 text-center text-dark">Reset Password</h4>
    <p class="text-muted small mb-4 text-center">Enter your new password below.</p>

    <form (ngSubmit)="onResetPassword()">
      
      <!-- New Password -->
      <div class="mb-3">
        <label class="form-label small fw-semibold">New Password</label>
        <input 
          type="password" 
          class="form-control form-control-sm rounded" 
          placeholder="Enter new password"
          [(ngModel)]="newPassword" 
          name="newPassword">
        <div *ngIf="isSubmitted && !isPasswordValid()" class="text-danger small mt-1">
          Password must be at least 6 characters.
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-4">
        <label class="form-label small fw-semibold">Confirm Password</label>
        <input 
          type="password" 
          class="form-control form-control-sm rounded" 
          placeholder="Confirm new password"
          [(ngModel)]="confirmPassword" 
          name="confirmPassword">
        <div *ngIf="isSubmitted && !isConfirmPasswordValid()" class="text-danger small mt-1">
          Passwords do not match.
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-purple btn-sm w-100 rounded text-white fw-semibold mb-3"
        [disabled]="isLoading">
        <span *ngIf="!isLoading">Save Password</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
      </button>

    </form>

    <div class="text-center small">
      <a routerLink="/login" class="text-purple text-decoration-none fw-semibold">Back to Login</a>
    </div>

  </div>

</div>
