<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud File Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Small toast for success / error messages -->
  <div id="toast" class="toast"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">☁️</span>
      <div>
        <h1>Cloud File Dashboard</h1>
        <p class="tagline">One dashboard for Google Drive &amp; Dropbox</p>
      </div>
    </div>
    <div id="apiStatus" class="api-status">Checking backend…</div>
  </header>

  <main class="layout">
    <!-- LEFT: provider picker + upload -->
    <aside class="sidebar">
      <section class="card">
        <h2>Providers</h2>
        <p class="hint">Click Connect to sign in, then pick a vault to browse its files.</p>
        <div id="providers" class="provider-list">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <section class="card">
        <h2>Upload</h2>
        <label id="dropZone" class="drop-zone" for="uploadFile">
          <span class="drop-icon">⬆️</span>
          <span id="dropText">Click or drop a file here</span>
          <input type="file" id="uploadFile" hidden />
        </label>
        <button id="uploadBtn" class="btn btn-primary" disabled>Upload to <span id="uploadTarget">…</span></button>
      </section>
    </aside>

    <!-- RIGHT: toolbar + file grid -->
    <section class="content">
      <div class="toolbar card">
        <div class="toolbar-left">
          <div class="field">
            <label>Type</label>
            <select id="fileType">
              <option value="">All types</option>
              <option value="image">Images</option>
              <option value="video">Videos</option>
              <option value="audio">Audio</option>
              <option value="document">Documents</option>
              <option value="archive">Archives</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label>Sort by date</label>
            <select id="sortOrder">
              <option value="desc">Newest first</option>
              <option value="asc">Oldest first</option>
            </select>
          </div>
          <button id="refreshBtn" class="btn btn-secondary" disabled>Refresh</button>
        </div>
        <div id="fileCount" class="file-count"></div>
      </div>

      <div id="fileArea" class="file-area">
        <div class="empty-state">
          <span class="empty-icon">📂</span>
          <p>Select a provider to see your files.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Rename modal -->
  <div id="renameModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Rename file</h3>
      <p id="renameCurrent" class="hint"></p>
      <input type="text" id="renameInput" placeholder="New name" />
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeRename()">Cancel</button>
        <button class="btn btn-primary" onclick="submitRename()">Save</button>
      </div>
    </div>
  </div>

  <!-- Scripts: config first, then app -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
