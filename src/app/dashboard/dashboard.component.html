<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>📁 Rouleru - لوحة التحكم</h1>
    <button (click)="logout()" class="btn-logout">🚪 تسجيل الخروج</button>
  </header>

  <div class="connect-section">
    <h3>🔗 ربط الحسابات الخارجية</h3>
    <div class="connect-buttons">
      <button class="btn-google">☁️ Google Drive</button>
      <button class="btn-dropbox">📦 Dropbox</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="actions">
      <button class="btn-upload">📤 رفع ملف</button>
      <button class="btn-folder">📂 مجلد جديد</button>
    </div>
  </div>

  <div class="files-grid" *ngIf="!isLoading; else loading">
    <div *ngIf="files.length === 0" class="empty-state">
      <span>📭</span>
      <p>لا توجد ملفات</p>
    </div>

    <div *ngFor="let file of files" class="file-item">
      <div class="file-icon">{{ file.type === 'folder' ? '📂' : '📄' }}</div>
      <div class="file-info">
        <span class="file-name">{{ file.name }}</span>
        <span class="file-size" *ngIf="file.size">{{ (file.size / 1024).toFixed(1) }} KB</span>
      </div>
      <div class="file-actions">
        <button class="btn-edit">✏️</button>
        <button (click)="deleteFile(file.id)" class="btn-delete">🗑️</button>
      </div>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading-spinner">⏳ جاري التحميل...</div>
  </ng-template>
</div>
